<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explora convocatorias teatrales activas en StageLink Auditions.">
  <title>Audiciones · StageLink</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Cpath d='M18 18h30v8H27v7h17v8H27v10h-9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body data-page="feed">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <div class="app-frame">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-column">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main-content">
        <div class="page-heading">
          <div>
            <h1>Audiciones abiertas</h1>
            <p>Encuentra oportunidades por disciplina, ubicación y tipo de compensación.</p>
          </div>
          <div class="heading-actions"><a class="button secondary" id="feed-primary-action" href="create-audition.html">Publicar convocatoria</a></div>
        </div>

        <form class="filters" id="filter-form" role="search">
          <label class="search-field">
            <span class="sr-only">Buscar por obra, compañía, rol o ubicación</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input class="input" type="search" name="query" placeholder="Obra, compañía, rol…" autocomplete="off">
          </label>
          <label class="field">
            <span class="sr-only">Tipo de proyecto</span>
            <select class="select" name="type">
              <option value="">Todo tipo</option>
              <option>Teatro</option>
              <option>Musical</option>
              <option>Cortometraje</option>
            </select>
          </label>
          <label class="field">
            <span class="sr-only">Tipo de compensación</span>
            <select class="select" name="compensation">
              <option value="">Toda compensación</option>
              <option value="paid">Remunerado</option>
              <option value="ad-honorem">Ad honorem</option>
              <option value="experience">Intercambio</option>
            </select>
          </label>
          <label class="field">
            <span class="sr-only">Ubicación</span>
            <select class="select" name="location"><option value="">Toda ubicación</option></select>
          </label>
          <label class="filter-toggle"><input type="checkbox" name="saved"> Solo guardadas</label>
        </form>

        <div class="page-heading" style="margin-bottom:12px">
          <p class="results-meta" id="results-count" aria-live="polite"></p>
          <button class="button ghost small" id="clear-filters" type="button">Limpiar filtros</button>
        </div>
        <section class="audition-grid" id="audition-results" aria-label="Resultados de audiciones"></section>
      </main>
      <nav class="mobile-nav" id="mobile-nav"></nav>
    </div>
  </div>
</body>
</html>
