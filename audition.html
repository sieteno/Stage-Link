<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta los detalles y roles de una convocatoria en StageLink Auditions.">
  <title>Detalle de audición · StageLink</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Cpath d='M18 18h30v8H27v7h17v8H27v10h-9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body data-page="audition">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <div class="app-frame">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-column">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main-content"><div id="audition-detail"></div></main>
      <nav class="mobile-nav" id="mobile-nav"></nav>
    </div>
  </div>

  <dialog class="dialog" id="application-dialog" aria-labelledby="application-heading">
    <form id="application-form">
      <header class="dialog-header">
        <div><h2 id="application-heading">Enviar postulación</h2><p id="application-title"></p></div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="Cerrar"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
      </header>
      <div class="dialog-body">
        <fieldset class="fieldset">
          <legend>Materiales del portafolio</legend>
          <p class="form-note">Elige qué elementos deseas compartir con la productora.</p>
          <div class="check-grid" id="application-materials" style="margin-top:12px"></div>
        </fieldset>
        <label class="field" style="margin-top:18px"><span class="field-label">Nota para la productora (opcional)</span><textarea class="textarea" name="note" placeholder="Disponibilidad, enlaces o información relevante"></textarea></label>
      </div>
      <footer class="dialog-actions"><button class="button secondary" type="button" data-close-dialog>Cancelar</button><button class="button" type="submit">Confirmar y enviar</button></footer>
    </form>
  </dialog>
</body>
</html>
