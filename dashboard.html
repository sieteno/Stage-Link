<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Da seguimiento a postulaciones o gestiona candidatos en StageLink Auditions.">
  <title>Gestión · StageLink</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Cpath d='M18 18h30v8H27v7h17v8H27v10h-9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <div class="app-frame">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-column">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main-content">
        <section id="actor-dashboard">
          <div class="page-heading"><div><h1>Mis postulaciones</h1><p>Consulta el estado de cada proceso sin quedarte en una espera indefinida.</p></div><a class="button" href="feed.html">Buscar audiciones</a></div>
          <div class="stats-grid" id="application-stats"></div>
          <div class="application-list" id="application-list"></div>
        </section>

        <section id="producer-dashboard" hidden>
          <div class="page-heading"><div><h1>Gestión de talento</h1><p>Revisa perfiles, califica candidatos y registra notas privadas en un solo lugar.</p></div><a class="button" href="create-audition.html">Nueva convocatoria</a></div>
          <div class="dashboard-grid">
            <aside>
              <h2 class="section-title">Mis convocatorias</h2>
              <div class="management-list" id="management-list"></div>
            </aside>
            <section>
              <label class="field" style="margin-bottom:16px"><span class="field-label">Candidatos de</span><select class="select" id="managed-audition"></select></label>
              <div class="stats-grid" id="candidate-stats"></div>
              <div class="candidate-list" id="candidate-list"></div>
            </section>
          </div>
        </section>
      </main>
      <nav class="mobile-nav" id="mobile-nav"></nav>
    </div>
  </div>
</body>
</html>
