<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea una contraseña nueva para StageLink Auditions.">
  <title>Nueva contraseña · StageLink Auditions</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Cpath d='M18 18h30v8H27v7h17v8H27v10h-9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/config.js" defer></script>
  <script src="assets/backend.js" defer></script>
  <script src="assets/auth.js" defer></script>
</head>
<body data-auth-page="reset">
  <main class="welcome-page">
    <div class="welcome-shell">
      <section class="welcome-copy">
        <a class="brand" href="index.html" aria-label="StageLink Auditions"><span class="brand-mark">SL</span><span>StageLink<small>Auditions</small></span></a>
        <h1>Nueva.<br><span>Contraseña.</span></h1>
        <p>Protege tu cuenta con una contraseña que no utilices en otros servicios.</p>
      </section>
      <section class="role-entry">
        <div class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></div>
        <form class="auth-panel" id="reset-password-form">
          <h2>Crear contraseña nueva</h2>
          <p>El enlace recibido por correo autoriza este cambio.</p>
          <div class="auth-fields">
            <label class="field"><span class="field-label">Nueva contraseña</span><input class="input" type="password" name="password" required minlength="8" autocomplete="new-password"></label>
            <label class="field"><span class="field-label">Confirmar contraseña</span><input class="input" type="password" name="passwordConfirm" required minlength="8" autocomplete="new-password"></label>
          </div>
          <button class="button" type="submit">Guardar contraseña</button>
        </form>
        <p class="demo-note" id="connection-note">Validando el enlace…</p>
      </section>
    </div>
  </main>
</body>
</html>
